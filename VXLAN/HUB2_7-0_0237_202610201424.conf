        set role lan
        set snmp-index 14
        set interface "LAN"
        set vlanid 20
    next
    edit "vxlan20"
        set vdom "root"
        set type vxlan
        set snmp-index 15
        set interface "VPN-VXLAN"
    next
    edit "BR20"
